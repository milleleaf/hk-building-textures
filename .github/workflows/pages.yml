# Serve the textures to the map from Cloudflare Pages (pages.py has the design; Hugging Face stays the source of truth).
# Never uses the landsd group (no Lands D request). Inputs: mode verify (API check only), changed (shards whose sheets changed, at
# most once per shard per 24 h; the rest wait for the next run), all, or shard; product; dry (stage and count, no wrangler call).
# The daily schedule and the end-of-tick dispatch from cbd.yml only act when the repo variable PAGES_ENABLED is 'true'.
name: pages
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify, changed, all, shard]
        default: verify
      product:
        type: choice
        options: [all, indiv-k4, bake3dsd]
        default: all
      shard:
        description: 'mode shard: the shard number, e.g. 01'
        default: '01'
      dry:
        description: 'Stage the shard folders and count files; no Cloudflare call'
        type: boolean
        default: true
  schedule:
    - cron: '41 3 * * *'
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Cloudflare token and Pages access (prints status codes, the project count and project names only)'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api=https://api.cloudflare.com/client/v4
          for kind in account user; do      # an account-owned token verifies on the account endpoint, a user token on the user one
            if [ $kind = account ]; then url="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; else url="$api/user/tokens/verify"; fi
            code=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "$auth" "$url")
            echo "token verify ($kind endpoint): HTTP $code, status: $(python3 -c "import json;d=json.load(open('/tmp/verify.json'));print(d.get('result',{}).get('status'), d.get('success'))" 2>/dev/null)"
            [ "$code" = 200 ] && break
          done
          : > /tmp/names.txt; page=1
          while :; do
            code=$(curl -s -o /tmp/projects.json -w '%{http_code}' -H "$auth" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?page=$page")
            echo "Pages projects list, page $page: HTTP $code"
            python3 - <<'PY' || break
          import json
          d = json.load(open('/tmp/projects.json'))
          print('success:', d.get('success'), '| errors:', [e.get('message') for e in d.get('errors', [])], '| result_info:', d.get('result_info'))
          names = [p.get('name') for p in d.get('result') or []]
          open('/tmp/names.txt', 'a').write('\n'.join(names) + ('\n' if names else ''))
          raise SystemExit(0 if names and (d.get('result_info') or {}).get('count', 0) >= (d.get('result_info') or {}).get('per_page', 1) else 1)
          PY
            page=$((page + 1))
          done
          echo "$(grep -c . /tmp/names.txt || true) Pages projects: $(sort /tmp/names.txt | tr '\n' ' ')"
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'verify' || github.event_name == 'schedule' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      dry: ${{ steps.plan.outputs.dry }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODE: ${{ inputs.mode || 'changed' }}
      PRODUCT: ${{ inputs.product || 'all' }}
      SHARD: ${{ inputs.shard || '01' }}
      DRY: ${{ github.event_name == 'schedule' && 'false' || inputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        run: |
          python pages.py plan "$MODE" "$PRODUCT" "$SHARD" > plan.json
          python -c "import json;d=json.load(open('plan.json'));print('new sheets assigned:', d['assigned_new_sheets']);[print(j) for j in d['jobs']]; open('$GITHUB_OUTPUT','a').write('jobs='+json.dumps(d['jobs'])+'\ndry=$DRY\n')"
          if [ "$DRY" != true ] && ! git diff --quiet areas/pages-shards.json; then
            git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add areas/pages-shards.json && git commit -qm "pages: shard map, new sheets assigned" && git pull --rebase -q && git push -q
          fi
  deploy:
    needs: plan
    if: needs.plan.outputs.jobs != '[]' && needs.plan.outputs.jobs != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: ${{ matrix.job.project }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DRY: ${{ needs.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.ref_name }}          # after the plan job's shard-map commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24.14.0'
      - run: pip install -r requirements.txt && npm ci --ignore-scripts --no-audit --no-fund --prefix deploy
      - name: 'stage the whole shard (authenticated bucket sync, batch API, not per-file resolves)'
        id: stage
        run: |
          df -h / | tail -1
          python pages.py stage "${{ matrix.job.product }}" "${{ matrix.job.shard }}" "$RUNNER_TEMP/site" | tee stage.json
          echo "### ${{ matrix.job.project }}" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; cat stage.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: deploy
        if: env.DRY != 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy.sh "$RUNNER_TEMP/site" "${{ matrix.job.project }}" "${{ matrix.job.product }} ${{ matrix.job.shard }}"
      - name: record the deploy
        if: env.DRY != 'true'
        run: python pages.py mark "${{ matrix.job.product }}" "${{ matrix.job.shard }}" "${{ matrix.job.project }}" "$(python -c "import json;print(json.load(open('stage.json'))['files'])")" "${{ matrix.job.signature }}"
  index:
    needs: [plan, deploy]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.jobs != '[]' && needs.plan.outputs.jobs != '' && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DRY: ${{ needs.plan.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24.14.0'
      - run: pip install -r requirements.txt && npm ci --ignore-scripts --no-audit --no-fund --prefix deploy
      - name: 'stage the index project (root tilesets with absolute uris, manifests, shards.json)'
        run: python pages.py index "$RUNNER_TEMP/index" $( [ "$DRY" = true ] && echo --all-shards ) | tee index.json
      - name: deploy the index
        if: env.DRY != 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy.sh "$RUNNER_TEMP/index" milleleaf-hkbt-index "index"
