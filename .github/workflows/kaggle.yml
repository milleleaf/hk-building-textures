# Kaggle archive (kaggle_product.py): ONE public dataset per product, milleleaf/hk-building-textures-<product> (owner input).
# Manual only, never on a timer: every run uploads the whole product as a new dataset version (a Kaggle version is exactly the
# files of its upload folder). Needs the repo secret KAGGLE_API_TOKEN (Helen's token, placed by her; it does not exist yet).
name: kaggle
on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [indiv-k4, bake3dsd]
      owner:
        description: 'Kaggle owner of the dataset (a user or organization that exists)'
        default: 'milleleaf'
      dry:
        description: 'Stage and list only: no Kaggle call'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kaggle
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 60 ] || sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/kaggle && sudo chown "$USER" /mnt/kaggle && df -h /
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_OWNER: ${{ inputs.owner }}
          PRODUCT: ${{ inputs.product }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
          TMPDIR: /mnt/kaggle
        run: python kaggle_product.py "$PRODUCT" /mnt/kaggle $DRY
