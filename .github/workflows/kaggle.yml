# Kaggle archive (kaggle_group.py): one public dataset per product and 1:5000 map-sheet group, owned by helenkwok.
# Manual only, and only after a full bake: needs the repo secret KAGGLE_API_TOKEN (Helen's Kaggle token).
name: kaggle
on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [indiv-k4, bake3dsd]
      groups:
        description: 'Comma-separated 1:5000 groups (11-NW,...) or all'
        default: '11-NW'
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/kaggle && sudo chown "$USER" /mnt/kaggle && df -h / /mnt
      - env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PRODUCT: ${{ inputs.product }}
          GROUPS: ${{ inputs.groups }}
          TMPDIR: /mnt/kaggle
        run: python kaggle_group.py "$PRODUCT" "$GROUPS" /mnt/kaggle
