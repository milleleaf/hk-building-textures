# Build map sheets of one product (sheet.py, one sheet after another inside a job), then re-index what is published (publish.py).
# Resumable: sheets.py plan skips every sheet whose report.json is already on the bucket at the sheet index's revision date.
# Lands D allows 100 concurrent users: max-parallel 10 jobs x 4 requests each, and one run at a time (concurrency group;
# GitHub keeps one pending run in a group, so a third dispatch replaces the second while the first runs).
name: bake
on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [indiv-k4, bake3dsd]
      sheets:
        description: 'Comma-separated sheet numbers (11-NW-19B,...) or all'
        default: '11-NW-14C,11-NW-14D,11-NW-15C,11-NW-19A,11-NW-19B,11-NW-19C,11-NW-19D,11-NW-20A,11-NW-20C,11-NW-24A,11-NW-24B,11-NW-25A'
      per_job:
        description: 'Sheets per job (at most 256 jobs per run; 3,456 sheets need 14 or more)'
        default: '1'
      max_jobs:
        description: 'Jobs this run (at most 256)'
        default: '256'
permissions:
  contents: read
concurrency:
  group: landsd
  cancel-in-progress: false
env:
  WORK: /mnt/work
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORK: .
          PRODUCT: ${{ inputs.product }}
          SHEETS: ${{ inputs.sheets }}
          PER_JOB: ${{ inputs.per_job }}
          MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          m=$(python sheets.py plan "$PRODUCT" "$SHEETS" "$PER_JOB" "$MAX_JOBS")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
  sheet:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ inputs.product }} ${{ matrix.job.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
      - run: pip install -r requirements.txt && npm ci --ignore-scripts --no-audit --no-fund
      - name: tools (KTX-Software 4.4.2, checksum from its GitHub release; ffmpeg)
        run: |
          curl -fsSL -o ktx.tar.bz2 https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2
          echo 'a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  ktx.tar.bz2' | sha256sum -c
          mkdir -p "$RUNNER_TEMP/ktx" && tar -xjf ktx.tar.bz2 -C "$RUNNER_TEMP/ktx" --strip-components=1 && rm ktx.tar.bz2
          echo "KTX_BIN=$RUNNER_TEMP/ktx/bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ktx/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/ktx/lib" "$RUNNER_TEMP/ktx/bin/toktx" --version
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - name: disk and memory
        run: |
          # the runner had 103 GB free on / in the pilot (2026-10-23); the usual cleanup (2 min) only when under 60 GB
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 60 ] || sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt; free -g; nproc
      - name: build and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=12288
          PRODUCT: ${{ inputs.product }}
          SHEETS: ${{ matrix.job.sheets }}
        run: |
          failed=0
          for s in $SHEETS; do
            python sheet.py "$PRODUCT" "$WORK" "$s" || failed=1
            df -h /mnt | tail -1
          done
          exit $failed
  index:
    needs: [plan, sheet]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORK: .
          PRODUCT: ${{ inputs.product }}
        run: python publish.py "$PRODUCT"
